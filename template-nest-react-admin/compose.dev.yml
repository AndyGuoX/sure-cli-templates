# 本地开发用的 PostgreSQL。生产编排不在这里（见 deploy/docker-compose.yml）。
# 不写 name / container_name：让 compose 按目录名生成。
# 硬编码会把同一模板生成的所有项目并成同一个项目，共用容器和数据卷。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
