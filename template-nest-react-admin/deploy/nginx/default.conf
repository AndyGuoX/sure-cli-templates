# ---- 真实客户端 IP ----
# 前置 LB 写 X-Forwarded-For；只信私网段来的那一跳。LB 不在这三个私网段时改这里。
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- 限流（封顶用，不是精细限速）----
map $request_method $limit_write_key {
    default               $binary_remote_addr;
    GET                   "";
    HEAD                  "";
    OPTIONS               "";
}
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/s;
limit_req_zone $limit_write_key    zone=write:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=30r/m;
limit_req_status 429;

map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    ~^/api/ "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ 安全头全部放在 server 级：nginx 的 add_header 继承规则是「location 里只要写了一条
    # add_header，外层的就全部不生效」—— 所以下面的 location 一律不写 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://api:3100;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api burst=120 nodelay;
        limit_req zone=write burst=60 nodelay;
        proxy_pass http://api:3100;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires max;
    }

    location = /index.html {
        expires -1;
    }
}
